name: Dependabot gate

# Shared check: fails while the calling repo has open critical or high
# Dependabot alerts. Each repo calls it from dependabot-gate-caller.yml;
# the org ruleset requires "dependabot-gate / check".
on:
  workflow_call:

permissions:
  vulnerability-alerts: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on open critical or high Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          alerts=$(gh api --paginate "repos/$REPO/dependabot/alerts?state=open&severity=critical,high&per_page=100" \
            --jq '.[] | "\(.security_advisory.severity)\t\(.dependency.package.name)\t\(.dependency.manifest_path)\t\(.html_url)"')
          if [ -z "$alerts" ]; then
            echo "No open critical or high Dependabot alerts."
            exit 0
          fi
          count=$(printf '%s\n' "$alerts" | wc -l)
          {
            echo "## $count open critical/high Dependabot alerts"
            echo
            echo "| Severity | Package | Manifest | Alert |"
            echo "|---|---|---|---|"
            printf '%s\n' "$alerts" | sort | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$count open critical/high Dependabot alerts. Fix or dismiss them before merging."
          exit 1
