name: Dependabot gate

# Shared check: fails while the calling repo has any open Dependabot alert,
# at any severity. Each repo calls it from dependabot-gate-caller.yml;
# the org ruleset requires "dependabot-gate / check".
on:
  workflow_call:

permissions:
  vulnerability-alerts: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any open Dependabot alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Dependabot's own PRs are how alerts get fixed; blocking them
          # would leave a repo with alerts unable to ever clear them.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: allowed so it can fix alerts."
            exit 0
          fi
          alerts=$(gh api --paginate "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            --jq '.[] | "\(.security_advisory.severity)\t\(.dependency.package.name)\t\(.dependency.manifest_path)\t\(.html_url)"')
          if [ -z "$alerts" ]; then
            echo "No open Dependabot alerts."
            exit 0
          fi
          count=$(printf '%s\n' "$alerts" | wc -l)
          {
            echo "## $count open Dependabot alerts"
            echo
            echo "| Severity | Package | Manifest | Alert |"
            echo "|---|---|---|---|"
            printf '%s\n' "$alerts" | sort | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$count open Dependabot alerts. Fix or dismiss them before merging."
          exit 1
